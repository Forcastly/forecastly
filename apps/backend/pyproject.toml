[project]
name = "forecastly-backend"
version = "0.1.0"
description = "Forecastly — restaurant demand forecasting MVP backend"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "sqlalchemy[asyncio]>=2.0.51,<2.1",
    "psycopg[binary]>=3.3.4",
    "alembic>=1.18.5",
    "pydantic>=2.13.1,<3",
    "pydantic-settings>=2.5",
    "clerk-backend-api>=6.0.1",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.9",
    "pyright>=1.1.390",
]

# This is a deployable service, not a distributable library — don't build it as
# a package. `app` is importable because commands run from the backend/ dir.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
# target-version is inferred from project.requires-python.
# Generated Alembic revisions are artifacts — don't lint their style.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
# A local `alembic/` dir would otherwise mis-classify the `alembic` package.
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["app", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
