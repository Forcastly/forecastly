<div class="flex items-center gap-md">
<span class="font-headline-lg text-headline-lg font-bold text-primary dark:text-primary">Forecaster Pro</span>
</div>
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-primary-fixed-dim text-[24px]">notifications</span>
<span class="material-symbols-outlined text-primary-fixed-dim text-[24px]">settings</span>
<div class="w-10 h-10 rounded-full bg-surface-container overflow-hidden">

</div>

<div class="md:col-span-12 mb-lg">
<h1 class="font-display text-display text-on-surface">Location Analytics</h1>
</div>
<div class="md:col-span-8 bg-surface-container rounded-[1rem] p-md shadow-layer-1 border border-outline-variant h-64 flex items-center justify-center">
<div class="w-full h-full opacity-30" data-alt="A stylized, glowing neo-noir map visualization with bright neon green and blue data nodes over a dark slate background, representing complex global logistics." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAc2uO-djfCvocXk-7peQOdP6sIyZ17hNB9u-yVIz46nOTjONhGaF4Q0tlUX2QLFwCQ7hhRQEnR8HVfbzDQqTtcQo_FPMABQ06BsvCIp6fYQxLfL4xby53iITQ36prC1aPiopRIKE7dPUd77zPaZkTCCHBRirTcJvQM0jUKlIzZK6uqNcb--bpcUAA9TbgvHAGqF-JEhui9cLu1zg4P4ZMkJS6gL_Bvt3XCSi1vXluZqzsfXRyHptgs_w')"></div>
</div>
<div class="md:col-span-4 bg-surface-container rounded-[1rem] p-md shadow-layer-1 border border-outline-variant h-64 flex flex-col gap-base">
<div class="h-8 w-3/4 bg-surface-container-high rounded"></div>
<div class="h-8 w-1/2 bg-surface-container-high rounded"></div>
<div class="h-8 w-5/6 bg-surface-container-high rounded"></div>
</div>

<!-- Modal Overlay Backdrop -->
<div class="fixed inset-0 bg-background/80 backdrop-blur-md z-40 flex items-center justify-center p-4">
<!-- Error Modal -->
<div aria-modal="true" class="bg-[#1E293B] w-full max-w-lg rounded-[24px] p-lg shadow-layer-2 flex flex-col items-center text-center transform transition-all border border-[#334155]" role="dialog">
<!-- Icon Container -->
<div class="w-16 h-16 rounded-full bg-error-container/20 flex items-center justify-center mb-md glow-error">
<span class="material-symbols-outlined text-error text-[32px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">error</span>
</div>
<!-- Header -->
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Upload failed</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-lg">The file was rejected due to 3 errors.</p>
<!-- Error List -->
<div class="w-full bg-[#0F172A] rounded-[16px] p-md border border-[#334155] shadow-inner max-h-[200px] overflow-y-auto mb-lg text-left custom-scrollbar">
<ul class="flex flex-col gap-sm">
<li class="flex items-start gap-base bg-error-container/10 p-sm rounded-lg border border-error-container/30">
<span class="material-symbols-outlined text-error text-[18px] mt-0.5">warning</span>
<span class="font-body-md text-body-md text-error">Row 12 — quantity: must be a positive number.</span>
</li>
<li class="flex items-start gap-base bg-error-container/10 p-sm rounded-lg border border-error-container/30">
<span class="material-symbols-outlined text-error text-[18px] mt-0.5">warning</span>
<span class="font-body-md text-body-md text-error">Row 45 — location_id: invalid format, expected UUID.</span>
</li>
<li class="flex items-start gap-base bg-error-container/10 p-sm rounded-lg border border-error-container/30">
<span class="material-symbols-outlined text-error text-[18px] mt-0.5">warning</span>
<span class="font-body-md text-body-md text-error">Row 89 — date: missing required field.</span>
</li>
</ul>
</div>
<!-- Actions -->
<div class="w-full flex gap-md justify-center">
<button class="px-xl py-sm rounded-full bg-surface-container border border-[#334155] font-label-caps text-label-caps text-on-surface-variant hover:bg-surface-container-high transition-colors">
                    Cancel
                </button>
<button class="px-xl py-sm rounded-full bg-primary-container text-on-primary-fixed-variant font-label-caps text-label-caps hover:bg-primary-fixed transition-colors shadow-[0_0_15px_rgba(195,244,0,0.3)]">
                    Try again
                </button>
</div>

<style>
        /* Custom Scrollbar for Error List */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0F172A;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
