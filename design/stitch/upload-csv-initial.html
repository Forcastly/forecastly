<!-- Modal Overlay -->

<!-- Modal Container -->
<div class="bg-surface-container rounded-lg neo-shadow-modal w-full max-w-lg p-margin flex flex-col gap-md relative">

<!-- Header -->
<div class="flex flex-col gap-base">
<h2 class="font-headline-lg text-headline-lg text-primary">Upload sales data</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Upload a CSV with columns: date, item_name, quantity, and optional revenue.</p>
</div>
<!-- Dropzone -->
<div class="border-2 border-dashed border-outline-variant rounded-DEFAULT bg-surface flex flex-col items-center justify-center p-lg gap-sm transition-all duration-300 hover:border-primary-fixed-dim hover:bg-surface-container-high cursor-pointer group" id="dropzone">
<div class="w-16 h-16 rounded-full bg-surface-container-highest flex items-center justify-center mb-sm group-hover:bg-primary-container/10 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-4xl group-hover:text-primary-fixed-dim transition-colors" data-icon="upload_file" style="font-variation-settings: 'FILL' 0;">upload_file</span>
</div>
<p class="font-body-md text-body-md text-on-surface"><span class="font-bold text-primary-fixed-dim">Click to Choose file</span> or drag and drop</p>
<p class="font-label-caps text-label-caps text-on-surface-variant">CSV files only (Max. 10MB)</p>
<input accept=".csv" class="hidden" id="file-upload" type="file"/>
</div>
<!-- Actions -->
<div class="flex justify-end gap-sm mt-sm">
<button class="px-md py-sm rounded-full font-label-caps text-label-caps border border-outline text-secondary hover:bg-surface-container-high hover:text-on-surface transition-colors active:opacity-80">
                    Cancel
                </button>
<button class="px-md py-sm rounded-full font-label-caps text-label-caps bg-primary-fixed text-on-primary-fixed hover:bg-primary-container transition-colors shadow-[0_0_10px_rgba(195,244,0,0.3)] hover:shadow-[0_0_15px_rgba(195,244,0,0.5)] active:opacity-80">
                    Upload
                </button>
</div>
</div>
</div>
<script>
        // Simple drag and drop visual feedback
        const dropzone = document.getElementById('dropzone');
        
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropzone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            dropzone.classList.add('neo-dropzone-active');
        }

        function unhighlight(e) {
            dropzone.classList.remove('neo-dropzone-active');
        }
        
        // Handle click to open file dialog
        dropzone.addEventListener('click', () => {
             document.getElementById('file-upload').click();
        });
    </script>
</body></html>
